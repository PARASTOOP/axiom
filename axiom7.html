// Board layout: four non-overlapping rows of five squares in a snake path.
const BOARD_MARGIN = 30;
const SQ_W = 110, SQ_H = 90;
const BOARD_ROW_GAP = 25;
function getBoardPos(i) {
  const safeIndex = Math.max(0, Math.min(NUM_SQUARES - 1, i));
  const row = Math.floor(safeIndex / 5);
  const offset = safeIndex % 5;
  const col = row % 2 === 0 ? offset : 4 - offset;
  const colStep = (W - BOARD_MARGIN*2 - SQ_W) / 4;
  return {
    x: BOARD_MARGIN + col * colStep,
    y: BOARD_MARGIN + 20 + row * (SQ_H + BOARD_ROW_GAP)
  };
}

  winner:    p => [`Mission accomplished, ${p}! The Nebula is yours!`, `${p} has conquered AXIOM-7!`, `All hail the new Nebula Champion!`]
};

// ── GAME STATE ────────────────────────────────────────────────────────────────
let gs = {};

function defaultState() {
  return {
    screen: 'splash',
    numPlayers: 2,
    players: Array.from({length:6}, (_, i) => ({
      name: `Player ${i+1}`,
      emoji: EMOJIS[i],
      pos: 0,
      score: 0,
      defaultLvl: 'beginner'
    })),
    currentPlayer: 0,
    currentTurn: 1,
    diceVal: 0,
    diceRolled: false,
    currentQ: null,
    selectedLvl: null,
    challengeStarted: false,
    timerStart: 0,
    timerRemain: 60,
    hintUsed: false,
    awardPending: true,
    awardedTo: -1,
    awardConfirmed: false,
    wildEvent: null,
    wildSwapTarget: -1,
    wildStealTarget: -1,
    animating: false,
    animFrame: 0,
    animFrom: 0,
    animTo: 0,
    animStep: 0,
    log: [],
    stars: [],
    nebulae: [],
    driftX: 0,
    speechText: '',
    speechAlpha: 0,
    speechTimer: 0,
    scoreAnimPts: [],
    confetti: [],
    savedExists: false
  };
}

// ── STARFIELD (computed once) ─────────────────────────────────────────────────
function initStarfield(p) {
  gs.stars = Array.from({length:120}, (_, i) => ({
    x: p.random(W), y: p.random(H),
    r: p.random(0.5, 2.5),
    a: p.random(0.3, 1.0),
    phase: p.random(p.TWO_PI),
    speed: p.random(0.003, 0.008)
  }));
  gs.nebulae = Array.from({length:4}, () => ({
    x: p.random(100,600), y: p.random(100,500),
    rx: p.random(80,160), ry: p.random(60,120),
    col: [p.random([[80,40,140],[40,120,140],[180,80,80],[60,60,180]])]
      .flat(),
    a: p.random(0.04, 0.09)
  }));
}

// ── SAVE / LOAD ───────────────────────────────────────────────────────────────
const SAVE_VERSION = 1;
function isValidSave(save) {
  return !!save &&
    save.version === SAVE_VERSION &&
    Number.isInteger(save.numPlayers) && save.numPlayers >= 2 && save.numPlayers <= 6 &&
    Array.isArray(save.players) && save.players.length >= save.numPlayers &&
    save.players.slice(0, save.numPlayers).every(pl =>
      pl && typeof pl.name === 'string' && typeof pl.emoji === 'string' &&
      Number.isInteger(pl.pos) && pl.pos >= 0 && pl.pos < NUM_SQUARES &&
      Number.isFinite(pl.score) && typeof pl.defaultLvl === 'string'
    ) &&
    Number.isInteger(save.currentPlayer) && save.currentPlayer >= 0 && save.currentPlayer < save.numPlayers &&
    Number.isInteger(save.currentTurn) && save.currentTurn >= 1 &&
    Array.isArray(save.log);
}

function saveGame() {
  try {
    const save = {
      version: SAVE_VERSION,
      numPlayers: gs.numPlayers,
      players: gs.players,
      currentPlayer: gs.currentPlayer,
      currentTurn: gs.currentTurn,
      log: gs.log
    };
    localStorage.setItem('axiom7_save', JSON.stringify(save));
    gs.savedExists = true;
  } catch(e) {
    console.warn('AXIOM-7 could not save this game.', e);
  }
}

function loadSave() {
  try {
    const raw = localStorage.getItem('axiom7_save');
    if (!raw) return null;
    const save = JSON.parse(raw);
    if (!isValidSave(save)) {
      localStorage.removeItem('axiom7_save');
      return null;
    }
    return save;
  } catch(e) {
    localStorage.removeItem('axiom7_save');
    return null;
  }
}

function clearSave() {
  localStorage.removeItem('axiom7_save');
  gs.savedExists = false;
}

// ── GAME LOGIC ────────────────────────────────────────────────────────────────
function startNewGame() {
  const names = gs.players.map(p => p.name);
  const emojis = gs.players.map(p => p.emoji);
  const defaults = gs.players.map(p => p.defaultLvl);
  gs = defaultState();
  initStarfield(window._p5);
  gs.savedExists = !!loadSave();
  for (let i = 0; i < 6; i++) {
    gs.players[i].name = names[i];
    gs.players[i].emoji = emojis[i];
    gs.players[i].defaultLvl = defaults[i];
  }
  gs.screen = 'setup';
  rebuildNameInputs();
}

function launchGame() {
  collectNameInputs();
  clearNameInputs();
  for (let i = 0; i < gs.numPlayers; i++) {
    gs.players[i].pos = 0;
    gs.players[i].score = 0;
  }
  gs.currentPlayer = 0;
  gs.currentTurn = 1;
  gs.log = [];
  gs.screen = 'roll';
  setSpeech('roll', gs.players[gs.currentPlayer].name);
  saveGame();
}

function doRoll(p) {
  if (gs.diceRolled || gs.animating) return;
  gs.diceVal = Math.floor(p.random(1, 7));
  gs.diceRolled = true;
  const cp = gs.players[gs.currentPlayer];
  gs.animFrom = cp.pos;
  gs.animTo = Math.min(cp.pos + gs.diceVal, NUM_SQUARES - 1);
  gs.animStep = 0;
  gs.animating = true;
  gs.animFrame = 0;
  saveGame();
}

function tickAnim() {
  if (!gs.animating) return;
  gs.animFrame++;
  if (gs.animFrame % 10 === 0) {
    const cp = gs.players[gs.currentPlayer];
    if (cp.pos < gs.animTo) {
      cp.pos++;
      gs.animStep++;
    }
    if (cp.pos >= gs.animTo) {
      gs.animating = false;
      afterMove();
    }
  }
}

function afterMove() {
  const cp = gs.players[gs.currentPlayer];
  if (cp.pos >= NUM_SQUARES - 1) {
    gs.screen = 'winner';
    setSpeech('winner', cp.name);
    saveGame();
    spawnConfetti(window._p5);
    return;
  }
  const type = SQ_TYPES[cp.pos];
  if (type === 'start') {
    nextTurn();
    return;
  }
  if (type === 'wild') {
    gs.wildEvent = WILD_EVENTS[Math.floor(Math.random() * WILD_EVENTS.length)];
    gs.screen = 'wild';
    gs.wildSwapTarget = -1;
    gs.wildStealTarget = -1;
    saveGame();
    return;
  }
  loadChallenge();
  gs.screen = 'challenge';
  setSpeech('challenge', gs.players[gs.currentPlayer].defaultLvl);
  saveGame();
}

function loadChallenge() {
  const cp = gs.players[gs.currentPlayer];
  const type = SQ_TYPES[cp.pos];
  const lvl = gs.selectedLvl || cp.defaultLvl;
  gs.selectedLvl = lvl;
  const bank = QUESTION_BANK[type]?.[lvl] || QUESTION_BANK.nova.beginner;
  gs.currentQ = bank[Math.floor(Math.random() * bank.length)];
  gs.challengeStarted = false;
  gs.timerRemain = TIMER_DEFAULT[lvl];
  gs.hintUsed = false;
  gs.awardPending = true;
  gs.awardedTo = -1;
  gs.awardConfirmed = false;
  updateFacPanel();
}

function startTimer() {
  gs.challengeStarted = true;
  gs.timerStart = Date.now();
}

function tickTimer() {
  if (!gs.challengeStarted || gs.screen !== 'challenge') return;
  const lvl = gs.selectedLvl || 'beginner';
  const total = TIMER_DEFAULT[lvl] * 1000;
  const elapsed = Date.now() - gs.timerStart;
  gs.timerRemain = Math.max(0, ((total - elapsed) / 1000));
  if (gs.timerRemain <= 0) {
    gs.screen = 'score';
    gs.awardedTo = -1;
    gs.awardedPts = 0;
    setSpeech('score', gs.currentQ?.a || '');
    updateFacPanel();
  }
}

function goToScore() {
  gs.screen = 'score';
  gs.challengeStarted = false;
  gs.awardPending = true;
  gs.awardedTo = -1;
  gs.awardConfirmed = false;
  setSpeech('score', gs.currentQ?.a || '');
  updateFacPanel();
  saveGame();
}

function getAwardPoints() {
  const lvl = LEVELS.find(l => l.id === (gs.selectedLvl || 'beginner')) || LEVELS[1];
  return Math.max(0, lvl.pts - (gs.hintUsed ? 1 : 0));
}

function skipAward() {
  if (gs.awardConfirmed) return;
  gs.awardedTo = -1;
  gs.awardedPts = 0;
  gs.awardConfirmed = true;
  gs.awardPending = false;
  gs.log.push({
    turn: gs.currentTurn,
    player: gs.players[gs.currentPlayer].name,
    square: SQ_LABELS[gs.players[gs.currentPlayer].pos],
    level: gs.selectedLvl,
    pts: 0,
    awardedTo: '—',
    ts: new Date().toLocaleTimeString()
  });
  saveGame();
}

function awardPoints(playerIdx, pts) {
  if (gs.awardConfirmed) return;
  gs.awardedTo = playerIdx;
  gs.awardedPts = pts;
  gs.players[playerIdx].score = Math.max(0, gs.players[playerIdx].score + pts);
  gs.awardConfirmed = true;
  gs.awardPending = false;
  gs.log.push({
    turn: gs.currentTurn,
    player: gs.players[gs.currentPlayer].name,
    square: SQ_LABELS[gs.players[gs.currentPlayer].pos],
    level: gs.selectedLvl,
    pts: pts,
    awardedTo: gs.players[playerIdx].name,
    ts: new Date().toLocaleTimeString()
  });
  spawnPtsAnim(window._p5, playerIdx, pts);
  saveGame();
}

function nextTurn() {
  gs.currentPlayer = (gs.currentPlayer + 1) % gs.numPlayers;
  gs.currentTurn++;
  gs.diceRolled = false;
  gs.diceVal = 0;
  gs.selectedLvl = gs.players[gs.currentPlayer].defaultLvl;
  gs.currentQ = null;
  gs.challengeStarted = false;
  gs.awardPending = true;
  gs.awardedTo = -1;
  gs.awardConfirmed = false;
  gs.wildEvent = null;
  gs.screen = 'roll';
  setSpeech('roll', gs.players[gs.currentPlayer].name);
  saveGame();
}

// ── WILD ACTIONS ──────────────────────────────────────────────────────────────
function wildSwapWith(idx) {
  const cp = gs.players[gs.currentPlayer];
  const tp = gs.players[idx];
  [cp.pos, tp.pos] = [tp.pos, cp.pos];
  gs.log.push({ turn:gs.currentTurn, player:cp.name, square:'WORMHOLE', level:'-', pts:0, awardedTo:tp.name, ts:new Date().toLocaleTimeString() });
  nextTurn();
}

function wildStealFrom(idx) {
  const cp = gs.players[gs.currentPlayer];
  const tp = gs.players[idx];
  if (tp.score > 0) { tp.score--; cp.score++; }
  gs.log.push({ turn:gs.currentTurn, player:cp.name, square:'HEIST', level:'-', pts:1, awardedTo:cp.name, ts:new Date().toLocaleTimeString() });
  nextTurn();
}

// ── SPEECH BUBBLES ────────────────────────────────────────────────────────────
function setSpeech(ctx, arg) {
  const lines = SPEECH_LINES[ctx]?.(arg) || [];
  gs.speechText = lines[Math.floor(Math.random() * lines.length)] || '';
  gs.speechAlpha = 0;
  gs.speechTimer = 300;
}

function tickSpeech() {
  if (gs.speechTimer > 0) {
    gs.speechTimer--;
    if (gs.speechAlpha < 255) gs.speechAlpha = Math.min(255, gs.speechAlpha + 8);
  } else {
    if (gs.speechAlpha > 0) gs.speechAlpha = Math.max(0, gs.speechAlpha - 4);
  }
}

// ── SCORE ANIMATION ───────────────────────────────────────────────────────────
function spawnPtsAnim(p, playerIdx, pts) {
  const col = PLAYER_COLS[playerIdx % PLAYER_COLS.length];
  gs.scoreAnimPts.push({ pts, col, alpha: 255, y: H - 80, vy: -1.5, life: 90 });
}

function tickScoreAnims() {
  gs.scoreAnimPts = gs.scoreAnimPts.filter(a => a.life > 0);
  for (const a of gs.scoreAnimPts) { a.y += a.vy; a.alpha = Math.max(0, a.alpha - 3); a.life--; }
}

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function spawnConfetti(p) {
  gs.confetti = Array.from({length:60}, () => ({
    x: p.random(W), y: p.random(-50, 0),
    r: p.random(5,12), col: [p.random(50,255), p.random(50,255), p.random(50,255)],
    vy: p.random(2,5), vx: p.random(-2,2), life: 200
  }));
}

function tickConfetti() {
  gs.confetti = gs.confetti.filter(c => c.life > 0);
  for (const c of gs.confetti) { c.x += c.vx; c.y += c.vy; c.life--; }
}

// ── FACILITATOR ───────────────────────────────────────────────────────────────
let facTarget = 0;
function updateFacPanel() {
  const qi = document.getElementById('fac-q');
  const ai = document.getElementById('fac-a');
  const hi = document.getElementById('fac-h');
  if (qi) qi.textContent = gs.currentQ?.q || '—';
  if (ai) ai.textContent = gs.currentQ?.a || '—';
  if (hi) hi.textContent = gs.currentQ?.hint || '—';
  const ab = document.getElementById('fac-award-btns');
  if (ab) {
    ab.innerHTML = '';
    for (let i = 0; i < gs.numPlayers; i++) {
      const b = document.createElement('button');
      b.textContent = gs.players[i].emoji + ' ' + gs.players[i].name.substring(0,6);
      b.onclick = () => { facTarget = i; };
      ab.appendChild(b);
    }
  }
}
function facAward(pts) { if (gs.screen==='score'||gs.screen==='challenge') awardPoints(facTarget, pts); }
function facMovePlayer() {
  const sq = parseInt(document.getElementById('fac-sq')?.value || '0');
  if (sq >= 0 && sq < NUM_SQUARES) {
    gs.players[gs.currentPlayer].pos = sq;
    saveGame();
  }
}
function facNextTurn() { nextTurn(); }

let facVisible = false;
document.getElementById('fac-toggle').addEventListener('click', () => {
  facVisible = !facVisible;
  document.getElementById('facilitator-panel').classList.toggle('visible', facVisible);
  document.getElementById('fac-toggle').textContent = facVisible ? '🔓' : '🔒';
});

// ── EXPORT ────────────────────────────────────────────────────────────────────
function exportResults() {
  const data = {
    date: new Date().toLocaleDateString(),
    players: gs.players.slice(0,gs.numPlayers).map(p=>({name:p.name,emoji:p.emoji,score:p.score})),
    winner: gs.players.slice(0,gs.numPlayers).sort((a,b)=>b.score-a.score)[0],
    log: gs.log
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `axiom7-results-${data.date.replace(/\//g,'-')}.json`;
  a.click(); URL.revokeObjectURL(url);
}

function copyTextSummary() {
  const winner = gs.players.slice(0,gs.numPlayers).sort((a,b)=>b.score-a.score)[0];
  let txt = `AXIOM-7 Game — ${new Date().toLocaleDateString()}\n`;
  txt += `Winner: ${winner.emoji} ${winner.name} with ${winner.score} pts\n\nScores:\n`;
  gs.players.slice(0,gs.numPlayers).sort((a,b)=>b.score-a.score)
    .forEach(p => { txt += `  ${p.emoji} ${p.name}: ${p.score} pts\n`; });
  txt += '\nGame Log:\n';
  gs.log.forEach(e => { txt += `  Turn ${e.turn}: ${e.player} → ${e.square} [${e.level}] → ${e.awardedTo} +${e.pts}pts\n`; });
  navigator.clipboard?.writeText(txt).catch(()=>{});
}

// ── NAME INPUTS ───────────────────────────────────────────────────────────────
let nameInputEls = [];
function rebuildNameInputs() {
  clearNameInputs();
  if (gs.screen !== 'setup') return;
  const container = document.getElementById('name-inputs');
  const canvasEl = document.querySelector('canvas');
  if (!canvasEl) return;
  const rect = canvasEl.getBoundingClientRect();
  const scale = rect.width / W;

  for (let i = 0; i < gs.numPlayers; i++) {
    const ry = 190 + i * 50;
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = `Player ${i+1}`;
    input.value = gs.players[i].name === `Player ${i+1}` ? '' : gs.players[i].name;
    input.maxLength = 16;
    input.style.left = (rect.left + 90 * scale) + 'px';
    input.style.top  = (rect.top + (ry + 10) * scale) + 'px';
    input.style.width  = (160 * scale) + 'px';
    input.style.height = (26 * scale) + 'px';
    input.style.fontSize = (11 * scale) + 'px';
    const idx = i;
    input.addEventListener('input', () => { gs.players[idx].name = input.value || `Player ${idx+1}`; });
    container.appendChild(input);
    nameInputEls.push(input);
  }
}

function clearNameInputs() {
  nameInputEls.forEach(el => el.remove());
  nameInputEls = [];
}

function repositionNameInputs() {
  if (gs.screen !== 'setup' || !nameInputEls.length) return;
  const canvasEl = document.querySelector('canvas');
  if (!canvasEl) return;
  const rect = canvasEl.getBoundingClientRect();
  const scale = rect.width / W;
  nameInputEls.forEach((input, i) => {
    const ry = 190 + i * 50;
    input.style.left = (rect.left + 90 * scale) + 'px';
    input.style.top = (rect.top + (ry + 10) * scale) + 'px';
    input.style.width = (160 * scale) + 'px';
    input.style.height = (26 * scale) + 'px';
    input.style.fontSize = Math.max(11, 11 * scale) + 'px';
  });
}
window.addEventListener('resize', repositionNameInputs);

function collectNameInputs() {
  nameInputEls.forEach((el, i) => {
    gs.players[i].name = el.value.trim() || `Player ${i+1}`;
  });
}

// ── UI PRIMITIVES ─────────────────────────────────────────────────────────────
function drawBg(p) {
  p.background(10,10,30);
  gs.driftX = (gs.driftX + 0.05) % W;
  // Nebulae
  for (const n of gs.nebulae) {
    p.noStroke();
    for (let layer = 3; layer >= 1; layer--) {
      p.fill(n.col[0], n.col[1], n.col[2], n.a * 255 / layer);
      p.ellipse((n.x + gs.driftX * 0.02) % W, n.y, n.rx * layer * 0.6, n.ry * layer * 0.6);
    }
  }
  // Stars
  for (const s of gs.stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(Date.now() * s.speed + s.phase);
    p.fill(255, 255, 255, s.a * twinkle * 220);
    p.noStroke();
    const sx = (s.x + gs.driftX * 0.05) % W;
    p.ellipse(sx, s.y, s.r, s.r);
  }
}

function drawGlowRect(p, x, y, w, h, r, col, glowStr=0) {
  if (glowStr > 0) {
    p.drawingContext.shadowBlur = glowStr;
    p.drawingContext.shadowColor = `rgba(${col[0]},${col[1]},${col[2]},0.7)`;
  }
  // gradient fill
  const grad = p.drawingContext.createLinearGradient(x, y, x, y+h);
  grad.addColorStop(0, `rgba(${col[0]+20},${col[1]+20},${col[2]+20},0.18)`);
  grad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0.08)`);
  p.drawingContext.fillStyle = grad;
  p.strokeWeight(1);
  p.stroke(col[0], col[1], col[2], 120);
  p.rect(x, y, w, h, r);
  p.drawingContext.shadowBlur = 0;
  p.noFill();
}

function drawButton(p, x, y, w, h, label, col, hovered, pressed) {
  const bcol = hovered
    ? [Math.min(255,col[0]+40),Math.min(255,col[1]+40),Math.min(255,col[2]+40)]
    : col;
  const alpha = pressed ? 0.5 : hovered ? 0.85 : 0.7;
  p.drawingContext.shadowBlur = hovered ? 12 : 0;
  p.drawingContext.shadowColor = `rgba(${col[0]},${col[1]},${col[2]},0.6)`;

  const grad = p.drawingContext.createLinearGradient(x, y, x, y+h);
  grad.addColorStop(0, `rgba(${bcol[0]},${bcol[1]},${bcol[2]},${alpha+0.1})`);
  grad.addColorStop(1, `rgba(${Math.max(0,bcol[0]-30)},${Math.max(0,bcol[1]-30)},${Math.max(0,bcol[2]-30)},${alpha})`);
  p.drawingContext.fillStyle = grad;
  p.strokeWeight(1);
  p.stroke(bcol[0], bcol[1], bcol[2], 200);
  p.rect(x, y, w, h, 5);
  // top highlight
  p.stroke(255,255,255, pressed ? 20 : 40);
  p.strokeWeight(1);
  p.line(x+4, y+1, x+w-4, y+1);

  p.drawingContext.shadowBlur = 0;
  p.fill(255);
  p.noStroke();
  p.textAlign(p.CENTER, p.CENTER);
  p.textSize(10);
  p.textFont("system-ui");
  p.text(label, x+w/2, y+h/2);
}

function isHover(p, x, y, w, h) { return p.mouseX>=x && p.mouseX<=x+w && p.mouseY>=y && p.mouseY<=y+h; }

function drawTopBar(p) {
  if (gs.screen === 'setup' || gs.screen === 'splash' || gs.screen === 'winner') return;
  const cp = gs.players[gs.currentPlayer];
  p.fill(0, 0, 0, 120);
  p.noStroke();
  p.rect(0, 0, W, 22);
  p.fill(180,210,255);
  p.textAlign(p.LEFT, p.CENTER);
  p.textSize(9);
  p.textFont("system-ui");
  p.text(`${cp.emoji} ${cp.name}   TURN ${gs.currentTurn}`, 10, 11);
  p.textAlign(p.RIGHT, p.CENTER);
  p.text(`SQ ${cp.pos+1}/20`, W-10, 11);
}

function drawScoreBar(p) {
  const n = gs.numPlayers;
  const sw = (W - 20) / n;
  for (let i = 0; i < n; i++) {
    const pl = gs.players[i];
    const x = 10 + i * sw;
    const y = H - 38;
    const col = PLAYER_COLS[i % PLAYER_COLS.length];
    p.fill(0,0,0,100);
    p.stroke(col);
    p.strokeWeight(i === gs.currentPlayer ? 2 : 1);
    p.rect(x, y, sw-4, 32, 3);
    p.noStroke();
    p.fill(col);
    p.textAlign(p.CENTER, p.TOP);
    p.textFont("system-ui");
    p.textSize(8);
    p.text(`${pl.emoji} ${pl.name.substring(0,7)}`, x+sw/2-2, y+3);
    p.textSize(11);
    p.fill(255);
    p.text(pl.score + ' pts', x+sw/2-2, y+16);
  }
}

function drawBoardMiniCompact(p, cx, cy, cw, ch) {
  p.fill(0,0,0,160);
  p.stroke(50,80,120);
  p.strokeWeight(1);
  p.rect(cx, cy, cw, ch, 4);

  const cols = 5, rows = 4;
  const sqW = (cw-14)/cols, sqH = (ch-14)/rows;

  for (let i = 0; i < NUM_SQUARES; i++) {
    const pos = getBoardPos(i);
    const bx = cx + 7 + (pos.x - BOARD_MARGIN) / (W - BOARD_MARGIN*2 - SQ_W) * (cw-14-sqW);
    const by = cy + 7 + (pos.y - BOARD_MARGIN - 20) / (3 * (SQ_H + BOARD_ROW_GAP)) * (ch-14-sqH);
    const type = SQ_TYPES[i];
    const col = SQ_COLS[type] || [80,80,80];

    const active = gs.players.slice(0,gs.numPlayers).some(pl => pl.pos === i);
    const glow = active ? 10 : 0;
    if (glow) { p.drawingContext.shadowBlur=glow; p.drawingContext.shadowColor=`rgb(${col[0]},${col[1]},${col[2]})`; }
    p.fill(col[0],col[1],col[2], active?200:80);
    p.noStroke();
    p.rect(bx, by, sqW, sqH, 2);
    p.drawingContext.shadowBlur=0;

    for (let j = 0; j < gs.numPlayers; j++) {
      if (gs.players[j].pos === i) {
        const pcol = PLAYER_COLS[j % PLAYER_COLS.length];
        p.fill(pcol);
        p.ellipse(bx+sqW/2 + (j-1)*4, by+sqH/2, 5, 5);
      }
    }
  }
}

// ── BOARD FULL ────────────────────────────────────────────────────────────────
function drawBoardFull(p) {
  const t = Date.now() / 1000;
  // Draw path arrows
  p.stroke(60,90,120,80);
  p.strokeWeight(1);
  p.noFill();
  for (let i = 0; i < NUM_SQUARES-1; i++) {
    const a = getBoardPos(i), b = getBoardPos(i+1);
    const ax = a.x+SQ_W/2, ay = a.y+SQ_H/2, bx = b.x+SQ_W/2, by = b.y+SQ_H/2;
    p.line(ax,ay,bx,by);
  }

  for (let i = 0; i < NUM_SQUARES; i++) {
    const pos = getBoardPos(i);
    const type = SQ_TYPES[i];
    const col = SQ_COLS[type] || [80,80,80];
    const isActive = gs.players.slice(0,gs.numPlayers).some(pl=>pl.pos===i);
    const pulse = isActive ? 8 + 4*Math.sin(t*3) : 0;

    if (pulse>0) {
      p.drawingContext.shadowBlur = pulse*2;
      p.drawingContext.shadowColor = `rgba(${col[0]},${col[1]},${col[2]},0.9)`;
    }
    // Gradient fill
    const grad = p.drawingContext.createLinearGradient(pos.x, pos.y, pos.x, pos.y+SQ_H);
    grad.addColorStop(0, `rgba(${col[0]+20},${col[1]+20},${col[2]+20},0.3)`);
    grad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0.12)`);
    p.drawingContext.fillStyle = grad;
    p.stroke(col[0],col[1],col[2], isActive?220:100);
    p.strokeWeight(isActive?2:1);
    // inner highlight
    p.rect(pos.x, pos.y, SQ_W, SQ_H, 8);
    p.drawingContext.shadowBlur=0;
    // inner top highlight
    p.stroke(255,255,255,20);
    p.strokeWeight(1);
    p.line(pos.x+6,pos.y+1,pos.x+SQ_W-6,pos.y+1);

    // Square number
    p.fill(col[0],col[1],col[2],180);
    p.noStroke();
    p.textFont("system-ui");
    p.textSize(7);
    p.textAlign(p.LEFT, p.TOP);
    p.text(i+1, pos.x+4, pos.y+3);

    // Crew emoji
    p.textSize(18);
    p.textAlign(p.CENTER, p.CENTER);
    p.text(SQ_CREW[i], pos.x+SQ_W/2, pos.y+SQ_H/2 - 10);

    // Label
    p.fill(200,220,255, isActive?255:160);
    p.textSize(6.5);
    p.textFont("system-ui");
    p.textAlign(p.CENTER, p.BOTTOM);
    const lbl = SQ_LABELS[i].length > 14 ? SQ_LABELS[i].substring(0,13)+'…' : SQ_LABELS[i];
    p.text(lbl, pos.x+SQ_W/2, pos.y+SQ_H-4);

    // Player tokens
    let tokenIdx = 0;
    for (let j=0;j<gs.numPlayers;j++) {
      if (gs.players[j].pos===i) {
        const pcol = PLAYER_COLS[j%PLAYER_COLS.length];
        p.fill(pcol);
        p.stroke(255,255,255,120);
        p.strokeWeight(1);
        p.ellipse(pos.x+SQ_W/2-8+tokenIdx*10, pos.y+SQ_H/2+10, 10, 10);
        p.noStroke();
        p.fill(255);
        p.textSize(7);
        p.textAlign(p.CENTER,p.CENTER);
        p.text(gs.players[j].emoji, pos.x+SQ_W/2-8+tokenIdx*10, pos.y+SQ_H/2+10);
        tokenIdx++;
      }
    }
  }
}

  const col = SQ_COLS[type] || [55,138,221];
  const lvl = gs.selectedLvl || 'beginner';
  const lvlDef = LEVELS.find(l=>l.id===lvl) || LEVELS[1];

  // Q&A display
  p.fill(0,0,0,140);
  p.stroke(col[0],col[1],col[2],80);
  p.strokeWeight(1);
  p.rect(14,28,W-28,90,6);

  p.fill(col[0],col[1],col[2]);
  p.textFont("system-ui");
  p.textSize(8);
  p.textAlign(p.LEFT,p.TOP);
  p.noStroke();
  p.text('QUESTION:', 24, 34);
  p.fill(200,220,255);
  p.textFont("monospace");
  p.textSize(9);
  p.textWrap(p.WORD);
  p.text(gs.currentQ?.q||'—', 24, 46, W-48, 30);

  p.fill(80,220,120);
  p.textFont("system-ui");
  p.textSize(8);
  p.text('ANSWER:', 24, 78);
  p.fill(180,255,180);
  p.textFont("monospace");
  p.textSize(9);
  p.textWrap(p.WORD);
  p.text(gs.currentQ?.a||'—', 24, 90, W-48, 30);

  // Award section
  p.fill(160,200,255);
  p.textFont("system-ui");
  p.textSize(9);
  p.textAlign(p.CENTER,p.TOP);
  p.noStroke();
  p.text(`AWARD ${getAwardPoints()} PTS TO:`, W/2, 126);

  if (!gs.awardConfirmed) {
    const n=gs.numPlayers;
    const bw=Math.min(120,(W-30)/n-6);
    const totalW=n*(bw+6)-6;
    const startX=(W-totalW)/2;
    for (let i=0;i<n;i++) {
      const pl=gs.players[i];
      const pcol=PLAYER_COLS[i%PLAYER_COLS.length];
      const bx=startX+i*(bw+6), by=144;
      const bhov=isHover(p,bx,by,bw,42);
      const pcolArr=[parseInt(pcol.slice(1,3),16),parseInt(pcol.slice(3,5),16),parseInt(pcol.slice(5,7),16)];
      drawButton(p,bx,by,bw,42,`${pl.emoji}\n${pl.name.substring(0,8)}`,pcolArr,bhov,false);
      if (gs.awardedTo===i) {
        p.stroke(80,255,120);
        p.strokeWeight(2);
        p.noFill();
        p.rect(bx-1,by-1,bw+2,44,6);
        p.noStroke();
      }
    }
    // Skip / no award
    const skiphov=isHover(p,W/2-60,196,120,26);
    drawButton(p,W/2-60,196,120,26,'SKIP (0pts)',[80,80,100],skiphov,false);
  } else {
    const winner=gs.players[gs.awardedTo];
    p.fill(80,255,140);
    p.textFont("system-ui");
    p.textSize(12);
    p.textAlign(p.CENTER,p.CENTER);
    p.drawingContext.shadowBlur=12;
    p.drawingContext.shadowColor='rgba(80,255,140,0.6)';
    p.text(`${winner.emoji} ${winner.name} +${gs.awardedPts} pts!`, W/2, 180);
    p.drawingContext.shadowBlur=0;
  }

  // Confirm / Next
  if (gs.awardedTo>=0 && !gs.awardConfirmed) {
    const chov=isHover(p,W/2-80,232,160,30);
    drawButton(p,W/2-80,232,160,30,'CONFIRM AWARD',[55,200,100],chov,p.mouseIsPressed&&chov);
  }

  if (gs.awardConfirmed) {
    const nhov=isHover(p,W/2-80,232,160,30);
    drawButton(p,W/2-80,232,160,30,'NEXT TURN →',[55,138,221],nhov,p.mouseIsPressed&&nhov);
  }

  drawScoreBar(p);
  drawSpeechBubble(p);
  drawScoreAnims(p);
  drawKeyHints(p,['1-6: Award to player','0: Skip','ENTER: Next turn']);
}

function drawWild(p) {
  drawBg(p);
  drawTopBar(p);
  const ev=gs.wildEvent;
  if (!ev) return;

  // Full-screen overlay
  p.fill(0,0,0,180);
  p.noStroke();
  p.rect(0,0,W,H);

  p.drawingContext.shadowBlur=30;
  p.drawingContext.shadowColor='rgba(200,150,50,0.9)';
  p.textSize(60);
  p.textAlign(p.CENTER,p.CENTER);
  p.text(ev.emoji, W/2, H/2-100);
  p.drawingContext.shadowBlur=0;

  p.fill(220,180,80);
  p.textFont("system-ui");
  p.textSize(22);
  p.text(ev.name, W/2, H/2-40);

  p.fill(200,220,255);
  p.textFont("monospace");
  p.textSize(11);
  p.textWrap(p.WORD);
  p.text(ev.text, W/2-200, H/2-10, 400, 60);

  if (ev.type==='swap' || ev.type==='steal') {
    p.fill(160,200,255);
    p.textFont("system-ui");
    p.textSize(9);
    p.textAlign(p.CENTER,p.TOP);
    p.noStroke();
    p.text('CHOOSE A PLAYER:', W/2, H/2+60);
    const n=gs.numPlayers;
    const bw=90;
    const totalW=n*bw+(n-1)*8;
    const sx=(W-totalW)/2;
    for (let i=0;i<n;i++) {
      if (i===gs.currentPlayer) continue;
      const pl=gs.players[i];
      const pcol=PLAYER_COLS[i%PLAYER_COLS.length];
      const bx=sx+i*(bw+8), by=H/2+78;
      const pcolArr=[parseInt(pcol.slice(1,3),16),parseInt(pcol.slice(3,5),16),parseInt(pcol.slice(5,7),16)];
      const bhov=isHover(p,bx,by,bw,32);
      drawButton(p,bx,by,bw,32,`${pl.emoji} ${pl.name.substring(0,6)}`,pcolArr,bhov,false);
    }
  } else {
    const shov=isHover(p,W/2-80,H/2+70,160,32);
    drawButton(p,W/2-80,H/2+70,160,32,'FACILITATOR AWARDS',[200,150,50],shov,false);
    const nthov=isHover(p,W/2-60,H/2+112,120,28);
    drawButton(p,W/2-60,H/2+112,120,28,'NEXT TURN',[80,100,140],nthov,false);
  }

  const skiphov=isHover(p,W-110,H-52,100,28);
  drawButton(p,W-110,H-52,100,28,'SKIP',[80,80,100],skiphov,false);
}

function drawBoard(p) {
  drawBg(p);
  drawTopBar(p);
  drawBoardFull(p);
  drawScoreBar(p);

  // Back to roll button
  const bhov=isHover(p,10,H-52,120,28);
  drawButton(p,10,H-52,120,28,'← ROLL SCREEN',[55,100,180],bhov,p.mouseIsPressed&&bhov);
}

function drawWinner(p) {
  drawBg(p);
  drawConfetti(p);

  const sorted=[...gs.players.slice(0,gs.numPlayers)].sort((a,b)=>b.score-a.score);
  const winner=sorted[0];

  p.drawingContext.shadowBlur=40;
  p.drawingContext.shadowColor='rgba(255,220,80,0.9)';
  p.textSize(50);
  p.textAlign(p.CENTER,p.CENTER);
  p.text('🏆', W/2, 80);
  p.drawingContext.shadowBlur=0;

  p.fill(255,220,80);
  p.textFont("system-ui");
  p.textSize(20);
  p.textAlign(p.CENTER,p.TOP);
  p.drawingContext.shadowBlur=14;
  p.drawingContext.shadowColor='rgba(255,220,80,0.7)';
  p.text('MISSION COMPLETE!', W/2, 120);
  p.drawingContext.shadowBlur=0;

  p.fill(200,230,255);
  p.textSize(12);
  p.text(`${winner.emoji} ${winner.name} wins with ${winner.score} pts!`, W/2, 148);

  // Score table
  for (let i=0;i<sorted.length;i++) {
    const pl=sorted[i];
    const ry=180+i*38;
    const pcol=PLAYER_COLS[gs.players.indexOf(pl)%PLAYER_COLS.length];
    const medal=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'][i];
    p.fill(0,0,0,100);
    p.noStroke();
    p.rect(80,ry,W-160,32,4);
    p.stroke(pcol);
    p.strokeWeight(i===0?2:1);
    p.rect(80,ry,W-160,32,4);
    p.noStroke();
    p.fill(255);
    p.textFont("system-ui");
    p.textSize(11);
    p.textAlign(p.LEFT,p.CENTER);
    p.text(`${medal} ${pl.emoji} ${pl.name}`, 96, ry+16);
    p.fill(pcol);
    p.textAlign(p.RIGHT,p.CENTER);
    p.text(`${pl.score} pts`, W-96, ry+16);
  }

  // Game log
  const logY=180+gs.numPlayers*38+10;
  p.fill(0,0,0,120);
  p.stroke(40,70,120);
  p.strokeWeight(1);
  p.rect(80,logY,W-160,Math.min(gs.log.length*14+12,80),4);
  p.noStroke();
  p.fill(100,140,180);
  p.textFont("monospace");
  p.textSize(7);
  p.textAlign(p.LEFT,p.TOP);
  for (let i=0;i<Math.min(gs.log.length,5);i++) {
    const e=gs.log[gs.log.length-1-i];
    p.text(`T${e.turn} ${e.player} → ${e.square} [${e.level}] → ${e.awardedTo} +${e.pts}pt`, 88, logY+6+i*14);
  }

  // Buttons
  const nhov=isHover(p,W/2-100,H-80,90,32);
  drawButton(p,W/2-100,H-80,90,32,'NEW GAME',[55,138,221],nhov,p.mouseIsPressed&&nhov);
  const ehov=isHover(p,W/2+10,H-80,90,32);
  drawButton(p,W/2+10,H-80,90,32,'EXPORT',[100,160,80],ehov,p.mouseIsPressed&&ehov);
  const chov=isHover(p,W/2-40,H-40,80,24);
  drawButton(p,W/2-40,H-40,80,24,'COPY TEXT',[80,100,140],chov,p.mouseIsPressed&&chov);

  drawSpeechBubble(p);
  drawKeyHints(p,['R: New game','E: Export']);
}

// ── INPUT HANDLERS ────────────────────────────────────────────────────────────
function handleClick(p) {
  const mx=p.mouseX, my=p.mouseY;
  const screen=gs.screen;

  if (screen==='splash') {
    if (isHover(p,W/2-100,H/2+10,200,36)) {
      gs.screen='setup';
      gs.numPlayers=2;
      for(let i=0;i<6;i++){gs.players[i].pos=0;gs.players[i].score=0;}
      rebuildNameInputs();
      return;
    }
    if (gs.savedExists && isHover(p,W/2-100,H/2+56,200,36)) {
      const save=loadSave();
      if (save) {
        gs.numPlayers=save.numPlayers;
        for(let i=0;i<save.numPlayers;i++){
          gs.players[i].name=save.players[i].name;
          gs.players[i].emoji=save.players[i].emoji;
          gs.players[i].pos=save.players[i].pos;
          gs.players[i].score=save.players[i].score;
          gs.players[i].defaultLvl=save.players[i].defaultLvl||'beginner';
        }
        gs.currentPlayer=save.currentPlayer;
        gs.currentTurn=save.currentTurn;
        gs.log=save.log||[];
        gs.screen='roll';
        initStarfield(p);
        setSpeech('roll',gs.players[gs.currentPlayer].name);
      }
    }
    return;
  }

  if (screen==='setup') {
    // Player count
    for (let n=2;n<=6;n++) {
      const bx=120+(n-2)*52,by=72,bw=46,bh=22;
      if (isHover(p,bx,by,bw,bh)) {
        const prev=gs.numPlayers;
        gs.numPlayers=n;
        if (n!==prev) rebuildNameInputs();
        return;
      }
    }
    // Emoji picker
    for (let i=0;i<gs.numPlayers;i++) {
      const ry=190+i*50;
      for (let e=0;e<EMOJIS.length;e++) {
        const ex=44+e*26, ey=ry+20;
        const taken=gs.players.slice(0,gs.numPlayers).some((q,qi)=>qi!==i&&q.emoji===EMOJIS[e]);
        if (!taken && Math.sqrt((mx-ex)**2+(my-ey)**2)<11) {
          gs.players[i].emoji=EMOJIS[e];
          return;
        }
      }
      // Default level
      const lvls=LEVELS;
      for (let l=0;l<lvls.length;l++) {
        const lx=270+85+l*52,ly=ry+4,lw=50,lh=18;
        if (isHover(p,lx,ly,lw,lh)) { gs.players[i].defaultLvl=lvls[l].id; return; }
      }
    }
    // Launch
    if (isHover(p,W/2-80,H-80,160,36)) { launchGame(); return; }
    // Clear save
    if (gs.savedExists && isHover(p,W-130,H-80,120,28)) { clearSave(); return; }
    return;
  }

  if (screen==='roll') {
    if (!gs.diceRolled && !gs.animating) doRoll(p);
    else if (gs.diceRolled && !gs.animating) {
      const cp=gs.players[gs.currentPlayer];
      const dx=W/2-80;
      if (isHover(p,dx-70,256,140,32)) afterMove();
    }
    return;
  }

  if (screen==='board') {
    if (isHover(p,10,H-52,120,28)) { gs.screen='roll'; return; }
    return;
  }

  if (screen==='challenge') {
    // Level picker
    for (let l=0;l<LEVELS.length;l++) {
      const lv=LEVELS[l];
      const lx=14+l*82,ly=52,lw=80,lh=30;
      if (isHover(p,lx,ly,lw,lh)) {
        gs.selectedLvl=lv.id;
        loadChallenge();
        saveGame();
        return;
      }
    }
    // Start timer
    if (!gs.challengeStarted && isHover(p,W/2-90,222,180,30)) { startTimer(); return; }
    // Hint
    if (!gs.hintUsed && gs.currentQ?.hint && isHover(p,14,230,140,24)) {
      gs.hintUsed=true;
      saveGame();
      return;
    }
    // Done
    if (isHover(p,W-160,230,146,24)) { goToScore(); return; }
    return;
  }

  if (screen==='score') {
    if (!gs.awardConfirmed) {
      const n=gs.numPlayers;
      const lvl=gs.selectedLvl||'beginner';
      const lvlDef=LEVELS.find(l=>l.id===lvl)||LEVELS[1];
      const bw=Math.min(120,(W-30)/n-6);
      const totalW=n*(bw+6)-6;
      const startX=(W-totalW)/2;
      for (let i=0;i<n;i++) {
        if (isHover(p,startX+i*(bw+6),144,bw,42)) { gs.awardedTo=i; return; }
      }
      // Skip
      if (isHover(p,W/2-60,196,120,26)) { skipAward(); return; }
      // Confirm
      if (gs.awardedTo>=0 && isHover(p,W/2-80,232,160,30)) {
        awardPoints(gs.awardedTo, getAwardPoints());
        return;
      }
    } else {
      if (isHover(p,W/2-80,232,160,30)) { nextTurn(); return; }
    }
    return;
  }

  if (screen==='wild') {
    const ev=gs.wildEvent;
    if (!ev) return;
    // Skip
    if (isHover(p,W-110,H-52,100,28)) { nextTurn(); return; }
    if ((ev.type==='swap'||ev.type==='steal')) {
      const n=gs.numPlayers;
      const bw=90;
      const totalW=n*bw+(n-1)*8;
      const sx=(W-totalW)/2;
      for (let i=0;i<n;i++) {
        if (i===gs.currentPlayer) continue;
        const bx=sx+i*(bw+8),by=H/2+78;
        if (isHover(p,bx,by,bw,32)) {
          if (ev.type==='swap') wildSwapWith(i);
          else wildStealFrom(i);
          return;
        }
      }
    } else {
      if (isHover(p,W/2-60,H/2+112,120,28)) { nextTurn(); return; }
    }
    return;
  }

  if (screen==='winner') {
    if (isHover(p,W/2-100,H-80,90,32)) { startNewGame(); return; }
    if (isHover(p,W/2+10,H-80,90,32)) { exportResults(); return; }
    if (isHover(p,W/2-40,H-40,80,24)) { copyTextSummary(); return; }
    return;
  }
}

function handleKeyPress(p, key, keyCode) {
  if (gs.screen==='roll') {
    if (key===' ' || keyCode===13) {
      if (!gs.diceRolled && !gs.animating) doRoll(p);
      else if (gs.diceRolled && !gs.animating) afterMove();
    }
    if (key==='b'||key==='B') { gs.screen='board'; return; }
  }
  if (gs.screen==='challenge') {
    if (key==='1') { gs.selectedLvl='starter'; loadChallenge(); }
    if (key==='2') { gs.selectedLvl='beginner'; loadChallenge(); }
    if (key==='3') { gs.selectedLvl='intermediate'; loadChallenge(); }
    if (key==='4') { gs.selectedLvl='advanced'; loadChallenge(); }
    if (keyCode===13 && gs.challengeStarted) goToScore();
    if (key===' ' && !gs.challengeStarted) startTimer();
  }
  if (gs.screen==='score') {
    const lvlDef=LEVELS.find(l=>l.id===(gs.selectedLvl||'beginner'))||LEVELS[1];
    if (!gs.awardConfirmed) {
      const n=gs.numPlayers;
      for (let i=0;i<n;i++) {
        if (key===String(i+1)) { gs.awardedTo=i; return; }
      }
      if (key==='0') { skipAward(); return; }
      if (keyCode===13 && gs.awardedTo>=0) awardPoints(gs.awardedTo,getAwardPoints());
    } else {
      if (keyCode===13) nextTurn();
    }
  }
  if (gs.screen==='winner') {
    if (key==='r'||key==='R') startNewGame();
    if (key==='e'||key==='E') exportResults();
  }
  if (key==='f'||key==='F') {
    facVisible=!facVisible;
    document.getElementById('facilitator-panel').classList.toggle('visible',facVisible);
    document.getElementById('fac-toggle').textContent=facVisible?'🔓':'🔒';
  }
}

// ── MAIN LOOP (p5.js) ─────────────────────────────────────────────────────────
new p5(function(p) {
  window._p5 = p;

  p.setup = function() {
    const canvas = p.createCanvas(W, H);
    canvas.parent(document.body);
    canvas.elt.setAttribute('role', 'application');
    canvas.elt.setAttribute('aria-label', 'AXIOM-7 educational board game. Use the on-screen controls or the keyboard hints.');
    canvas.elt.tabIndex = 0;
    p.textFont("system-ui");
    gs = defaultState();
    initStarfield(p);
    gs.savedExists = !!loadSave();
    gs.selectedLvl = 'beginner';
  };

  p.draw = function() {
    tickAnim();
    tickTimer();
    tickSpeech();
    tickScoreAnims();
    tickConfetti();

    const s = gs.screen;
    if (s==='splash')    drawSplash(p);
    else if (s==='setup')     drawSetup(p);
    else if (s==='roll')      drawRoll(p);
    else if (s==='board')     drawBoard(p);
    else if (s==='challenge') drawChallenge(p);
    else if (s==='score')     drawScore(p);
    else if (s==='wild')      drawWild(p);
    else if (s==='winner')    drawWinner(p);
  };

  p.mousePressed = function() { handleClick(p); };
  p.keyPressed  = function() { handleKeyPress(p, p.key, p.keyCode); };
});
</script>
